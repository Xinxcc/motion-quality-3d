<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="300" rx="14" fill="#f7f9fb" stroke="#e2e8f0"/>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#16324f">3D Motion-Quality Analysis — vision pipeline</text>

  <!-- Row 1 -->
  <g>
    <rect x="30" y="58" width="196" height="76" rx="9" fill="#ffffff" stroke="#2c6e9b" stroke-width="1.4"/>
    <text x="128" y="88" font-size="13" font-weight="700" fill="#16324f" text-anchor="middle">multi-view video</text>
    <text x="128" y="109" font-size="11.5" fill="#64748b" text-anchor="middle">one or more cameras</text>

    <rect x="256" y="58" width="196" height="76" rx="9" fill="#ffffff" stroke="#2c6e9b" stroke-width="1.4"/>
    <text x="354" y="88" font-size="13" font-weight="700" fill="#16324f" text-anchor="middle">MediaPipe pose</text>
    <text x="354" y="109" font-size="11.5" fill="#64748b" text-anchor="middle">33 body landmarks</text>

    <rect x="482" y="58" width="196" height="76" rx="9" fill="#ffffff" stroke="#2c6e9b" stroke-width="1.4"/>
    <text x="580" y="88" font-size="13" font-weight="700" fill="#16324f" text-anchor="middle">camera calibration</text>
    <text x="580" y="109" font-size="11.5" fill="#64748b" text-anchor="middle">checkerboard · undistortion</text>

    <rect x="708" y="58" width="196" height="76" rx="9" fill="#eef4fa" stroke="#16324f" stroke-width="1.5"/>
    <text x="806" y="84" font-size="13" font-weight="700" fill="#16324f" text-anchor="middle">multi-view 3D</text>
    <text x="806" y="101" font-size="11" fill="#64748b" text-anchor="middle">F/E matrix (RANSAC)</text>
    <text x="806" y="117" font-size="11" fill="#64748b" text-anchor="middle">triangulation · solvePnP</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.6" marker-end="url(#am)">
    <line x1="226" y1="96" x2="254" y2="96"/><line x1="452" y1="96" x2="480" y2="96"/><line x1="678" y1="96" x2="706" y2="96"/>
  </g>
  <path d="M806,134 L806,150 L172,150 L172,174" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#am)"/>

  <!-- Row 2 -->
  <g>
    <rect x="42" y="182" width="260" height="76" rx="9" fill="#ffffff" stroke="#2c6e9b" stroke-width="1.4"/>
    <text x="172" y="210" font-size="13" font-weight="700" fill="#16324f" text-anchor="middle">sensor fusion</text>
    <text x="172" y="231" font-size="11" fill="#64748b" text-anchor="middle">wearable sensor · cross-correlation</text>
    <text x="172" y="247" font-size="11" fill="#64748b" text-anchor="middle">time-sync + resample</text>

    <rect x="332" y="182" width="260" height="76" rx="9" fill="#ffffff" stroke="#2c6e9b" stroke-width="1.4"/>
    <text x="462" y="210" font-size="13" font-weight="700" fill="#16324f" text-anchor="middle">feature extraction</text>
    <text x="462" y="231" font-size="11" fill="#64748b" text-anchor="middle">joint angles · trajectory metrics</text>
    <text x="462" y="247" font-size="11" fill="#64748b" text-anchor="middle">multi-dimensional DTW distances</text>

    <rect x="622" y="182" width="260" height="76" rx="9" fill="#eef4fa" stroke="#16324f" stroke-width="1.5"/>
    <text x="752" y="210" font-size="13" font-weight="700" fill="#16324f" text-anchor="middle">motion-quality classification</text>
    <text x="752" y="231" font-size="11" fill="#64748b" text-anchor="middle">Random Forest / Decision Tree / LogReg</text>
    <text x="752" y="247" font-size="11" fill="#64748b" text-anchor="middle">grid-search cross-validation</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.6" marker-end="url(#am)">
    <line x1="302" y1="220" x2="330" y2="220"/><line x1="592" y1="220" x2="620" y2="220"/>
  </g>
  <text x="30" y="288" font-size="11.5" fill="#64748b">Camera-derived 3D motion is aligned to a wearable sensor, compared to a reference with mDTW, and scored by a cross-validated classifier.</text>
</svg>
